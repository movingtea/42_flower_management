title = "Flower WMS controlled fixture that disables the built-in rules"

[extend]
useDefault = false

[[allowlists]]
description = "Historical evidence logs contain redacted placeholder values, not live credentials."
paths = [
  '''docs/evidence/.*''',
]

[[allowlists]]
description = "Checked-in env templates use placeholder values instead of real secrets."
paths = [
  '''(^|/)[^/]*\.env(\.[^/]*)?\.example$''',
]

[[allowlists]]
description = "Controlled fixtures use the E37CONTROLLED- marker."
regexes = [
  '''E37CONTROLLED-[A-Za-z0-9._-]{8,}''',
]