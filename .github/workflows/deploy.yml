name: Flower Platform CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ACR_REGISTRY: crpi-bp5b6vut8l4d7ebv.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: universe42
      IMAGE_REPO: flower-platform-app
      REMOTE_PLATFORM_DIR: /root/flower-platform
      DOCKER_CLI_HINTS: false

    steps:
      - name: Checkout Source Code via Private SSH
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Login to Alibaba Cloud ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin "${ACR_REGISTRY}"

      - name: Build Application Image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ASSET_BASE_URL: ${{ secrets.NEXT_PUBLIC_ASSET_BASE_URL }}
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_REPO}"
          echo "[build] start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --progress=plain \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-http://localhost:3000}" \
            --build-arg NEXT_PUBLIC_ASSET_BASE_URL="${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:3000}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .
          echo "[build] done $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker image inspect "${IMAGE}:latest" --format 'image={{.Id}} arch={{.Os}}/{{.Architecture}} size={{.Size}}'

      - name: Push Image to ACR
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_REPO}"
          export DOCKER_CLIENT_TIMEOUT=300

          echo "[push] latest start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker push "${IMAGE}:latest"
          echo "[push] latest done $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "[push] sha tag start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker push "${IMAGE}:${{ github.sha }}"
          echo "[push] sha tag done $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Execute Remote Deploy via Private Key SSH
        env:
          HOST_IP: ${{ secrets.HOST_NAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_PLATFORM_DIR: ${{ env.REMOTE_PLATFORM_DIR }}
        run: |
          echo "$SSH_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

          ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no "root@${HOST_IP}" \
            "REMOTE_PLATFORM_DIR=${REMOTE_PLATFORM_DIR} IMAGE_SHA=${{ github.sha }} bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${REMOTE_PLATFORM_DIR}"

          image="crpi-bp5b6vut8l4d7ebv.cn-hangzhou.personal.cr.aliyuncs.com/universe42/flower-platform-app:${IMAGE_SHA}"
          override="$(mktemp)"
          trap 'rm -f "$override"' EXIT
          printf 'services:\n  flower-web:\n    image: "%s"\n  flower-cron-worker:\n    image: "%s"\n' "$image" "$image" > "$override"
          compose() { docker compose -f docker-compose.yml -f "$override" "$@"; }

          echo "[deploy] pull SHA image from ACR..."
          compose pull flower-web flower-cron-worker
          compose run --rm --no-deps --entrypoint sh flower-web -ec '
            : "${DATABASE_URL:?DATABASE_URL is required}"
            : "${V2_DATABASE_URL:?V2_DATABASE_URL is required}"
            node scripts/check-v2-database-target.mjs --connect
          '

          echo "[deploy] restart app stack (db container untouched)..."
          compose stop flower-nginx flower-web flower-cron-worker || true
          compose rm -f flower-nginx flower-web flower-cron-worker || true
          compose up -d --no-deps flower-web flower-cron-worker
          compose up -d --no-deps flower-nginx

          echo "[deploy] wait for flower-web entrypoint (migrate + boot)..."
          ok=0
          for i in $(seq 1 30); do
            if compose exec -T flower-web wget -T 4 -qO- "http://127.0.0.1:3000/api/health" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "[deploy] WARNING: flower-web health probe timed out"
            docker compose logs --tail=80 flower-web
            exit 1
          fi

          echo "[deploy] prisma migrate status:"
          compose exec -T flower-web npx prisma migrate status
          compose exec -T flower-web npm run db:v2:migrate:status

          echo "[deploy] reload nginx (SSL / upstream)..."
          docker exec flower-nginx-edge nginx -s reload || true

          docker compose ps
          docker compose logs --tail=30 flower-web
          docker compose logs --tail=15 flower-cron-worker || true

          echo "[deploy] post-deploy disk snapshot..."
          df -h / || true
          docker system df || true

          if [[ -x ./scripts/deploy-cleanup.sh ]]; then
            echo "[deploy] running deploy-cleanup.sh (safe prune, no volumes)..."
            ./scripts/deploy-cleanup.sh --timeout 180 || echo "[deploy] WARNING: deploy-cleanup failed or skipped (see logs)"
          else
            echo "[deploy] deploy-cleanup.sh not found; running minimal safe prune..."
            docker container prune -f || true
            docker image prune -f || true
            docker network prune -f || true
            docker builder prune -f || true
          fi

          echo "[deploy] done."
          REMOTE

          rm -f /tmp/id_rsa
