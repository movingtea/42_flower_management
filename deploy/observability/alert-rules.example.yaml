# =============================================================================
# Flower WMS 告警规则示例（Sprint E3.3 alerting contract）
# =============================================================================
# 状态：示例 / 占位，未绑定任何告警平台，也未在生产启用。
#
# - 阈值、窗口、严重度、负责人、通知渠道、数据保留期全部是占位符（`<...>`），
#   必须由维护者或项目用户填入后才能启用；本 Sprint 不写真实值。
# - 指标名来自 E3.4 的 `deploy/observability/metrics-catalog.md`（单进程内存态，
#   多实例聚合与生产抓取网络由维护者补证）。
# - 备份 / 迁移信号来自 E2 的脚本与调度器（`Backup-Staging.ps1` 的 `BACKUP_OK`、
#   `db:v2:migrate:deploy` 退出码），不是 E3.4 应用指标；对应导出器或平台能力
#   未定，因此以 `<PLATFORM_EXPORTER...>` 占位。
# - 告警标签/注解禁止携带 request ID、URL 查询串、请求体、用户名、错误原文、
#   数据库连接串或任何密钥；只允许规则名、固定标签、路由模板与 Runbook 链接。
#
# 对应可执行目录：docs/sprint-e3-alert-catalog.md
# 校验示例：python -c "import yaml; yaml.safe_load(open('alert-rules.example.yaml', encoding='utf-8'))"
# =============================================================================

groups:
  - name: flower-wms-e33-availability
    interval: <SCRAPE_INTERVAL_PLACEHOLDER> # 维护者提供，例如 30s
    rules:
      # 1) 5xx 比率
      - alert: WmsHigh5xxRatio
        expr: |
          (
            sum(rate(wms_http_5xx_total[<WINDOW_5XX>]))
            /
            clamp_min(sum(rate(wms_http_requests_total[<WINDOW_5XX>])), 0.001)
          ) > <THRESHOLD_5XX_RATIO>
        for: <FOR_5XX_RATIO>
        labels:
          severity: <SEVERITY_5XX_RATIO> # 建议 critical，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-5xx-ratio
          signal: http_5xx_ratio
        annotations:
          summary: "HTTP 5xx 比例超过阈值（Flower WMS）"
          description: >-
            最近窗口内 5xx 比例超过占位阈值。请按 Runbook 检查错误事件（error.server）、
            受影响路由模板、依赖数据库/外部集成与最近发布。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-5xx-ratio

      # 2) 关键任务连续失败（cron 库存同步 / 订单过期）
      - alert: WmsCronConsecutiveFailures
        expr: |
          max by (task) (wms_cron_consecutive_failures) >= <THRESHOLD_CRON_CONSECUTIVE_FAILURES>
        for: <FOR_CRON_CONSECUTIVE_FAILURES>
        labels:
          severity: <SEVERITY_CRON> # 建议 critical，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-cron-consecutive-failures
          signal: cron_consecutive_failures
        annotations:
          summary: "关键后台任务连续失败（Flower WMS cron）"
          description: >-
            task={{ $labels.task }} 连续失败次数达到占位阈值。请检查 cron 容器退出语义、
            心跳文件与最近失败类别，避免用 web /api/health 代替 cron 健康判断。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-cron-consecutive-failures

      # 3) 数据库不可用（V1 / V2 探测失败）
      - alert: WmsDatabaseUnavailable
        expr: |
          (
            sum by (db) (increase(wms_db_probe_total{outcome="failure"}[<WINDOW_DB>]))
          ) >= <THRESHOLD_DB_PROBE_FAILURES>
        for: <FOR_DB_UNAVAILABLE>
        labels:
          severity: <SEVERITY_DB> # 建议 critical，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-db-unavailable
          signal: db_probe_failure
        annotations:
          summary: "数据库探测连续失败（Flower WMS {{ $labels.db }}）"
          description: >-
            db={{ $labels.db }} 的 SELECT 1 探测在窗口内失败次数超过占位阈值。
            公开 /api/health 只用于存活/就绪；内部拓扑与连接细节只在受保护入口查看。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-db-unavailable

  - name: flower-wms-e33-backup-migration
    interval: <SCRAPE_INTERVAL_PLACEHOLDER>
    rules:
      # 4) 备份失败 / 备份过期
      # E2 备份脚本成功时输出 BACKUP_OK <set>，失败时把备份集移入 failed/ 并以非零码退出。
      # 指标/导出器由平台补齐；未接入平台前以日志/任务退出码作为等价信号。
      - alert: WmsBackupJobFailed
        expr: |
          (
            time() - <PLATFORM_EXPORTER_BACKUP_LAST_SUCCESS_METRIC>
          ) > <THRESHOLD_BACKUP_MAX_AGE_SECONDS>
        for: <FOR_BACKUP_FAILED>
        labels:
          severity: <SEVERITY_BACKUP> # 建议 critical，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-backup-failed
          signal: backup_last_success_age
        annotations:
          summary: "备份任务失败或最近成功备份过期（Flower WMS）"
          description: >-
            备份任务未在占位时效内成功，或调度器报告失败（等价信号：
            Backup-Staging.ps1 未输出 BACKUP_OK、备份集进入 failed/、退出码非 0）。
            不得删除上一份有效备份，先按 Runbook 保留现场。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-backup-failed

      # 5) 迁移失败 / 迁移未验证
      # 信号：db:v2:migrate:deploy 非零退出、migrate status 非空挂起迁移、
      # 或发布流水线 migration 步骤失败。平台指标未定，以占位导出器表达。
      - alert: WmsMigrationFailed
        expr: |
          (
            increase(<PLATFORM_EXPORTER_MIGRATION_FAILED_METRIC>[<WINDOW_MIGRATION>])
          ) > <THRESHOLD_MIGRATION_FAILURES>
        for: <FOR_MIGRATION>
        labels:
          severity: <SEVERITY_MIGRATION> # 建议 critical，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-migration-failed
          signal: migration_failure
        annotations:
          summary: "数据库迁移失败（Flower WMS）"
          description: >-
            迁移步骤失败或存在未应用迁移。先确认目标数据库与备份可用性，
            不得在失败状态下继续发布；回滚按 E2 迁移/回滚计划执行。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-migration-failed

      # 6) 登录失败异常升高
      - alert: WmsLoginFailureSpike
        expr: |
          sum by (provider) (rate(wms_login_failures_total[<WINDOW_LOGIN>]))
            > <THRESHOLD_LOGIN_FAILURES_PER_SECOND>
        for: <FOR_LOGIN_SPIKE>
        labels:
          severity: <SEVERITY_LOGIN> # 建议 warning，待维护者确认
          owner: <OWNER_PLACEHOLDER>
          runbook_url: ../../docs/sprint-e3-alert-catalog.md#rb-login-failure-spike
          signal: login_failure_spike
        annotations:
          summary: "登录失败速率异常升高（Flower WMS {{ $labels.provider }}）"
          description: >-
            provider={{ $labels.provider }} 的登录失败速率超过占位阈值。
            日志只含安全账号指纹，禁止在告警或工单里记录明文用户名/密码；
            若疑似暴力破解，按安全事件流程升级。
          runbook: ../../docs/sprint-e3-alert-catalog.md#rb-login-failure-spike
