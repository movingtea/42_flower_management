# =============================================================================
# Flower WMS 告警投递示例（Sprint E3.3）
# =============================================================================
# 状态：示例 / 平台未定 / 未启用。本文件演示“严重度 → 接收渠道”的路由形态，
# 不包含任何真实地址、DSN、token、Webhook 或接收人。所有 `<...>` 必须由维护者
# 在选定平台后填写，或改写成该平台自己的配置格式（PagerDuty、Slack、Opsgenie、
# 邮件网关等）。
#
# 数据安全：通知载荷只允许规则名、固定标签（severity/owner/route 模板）、
# Runbook 链接与受控摘要；禁止携带 request ID、请求头/Cookie、查询串、请求体、
# 错误原文、数据库连接串、账号明文或第三方凭据。
#
# 对应说明：deploy/observability/README-ALERTS.md
#            docs/sprint-e3-alert-catalog.md
# =============================================================================

route:
  # 分组键只用固定低基数字段；禁止用 request ID / 业务 ID / 错误文本分组。
  group_by: [alertname, severity, owner]
  group_wait: <GROUP_WAIT_PLACEHOLDER>
  group_interval: <GROUP_INTERVAL_PLACEHOLDER>
  repeat_interval: <REPEAT_INTERVAL_PLACEHOLDER>
  receiver: <DEFAULT_RECEIVER_PLACEHOLDER>
  routes:
    - matchers: ['severity="critical"']
      receiver: <CRITICAL_RECEIVER_PLACEHOLDER> # 待维护者提供，例如值班通道
      continue: <CONTINUE_PLACEHOLDER>
    - matchers: ['severity="warning"']
      receiver: <WARNING_RECEIVER_PLACEHOLDER>
    - matchers: ['severity="info"']
      receiver: <INFO_RECEIVER_PLACEHOLDER>

inhibit_rules:
  # 数据库整体不可用期间抑制同源 5xx 告警，减少重复噪声（占位，待确认）。
  - source_matchers: ['alertname="WmsDatabaseUnavailable"']
    target_matchers: ['alertname="WmsHigh5xxRatio"']
    equal: [<INHIBIT_EQUAL_LABELS_PLACEHOLDER>]

receivers:
  - name: <DEFAULT_RECEIVER_PLACEHOLDER>
    # 平台未定：任选其一，由维护者填写真实值，不提交到仓库。
    # webhook_configs:
    #   - url: <WEBHOOK_URL_PLACEHOLDER>
    #     send_resolved: <SEND_RESOLVED_PLACEHOLDER>
    # pagerduty_configs:
    #   - service_key: <PAGERDUTY_SERVICE_KEY_PLACEHOLDER>
    # slack_configs:
    #   - api_url: <SLACK_WEBHOOK_PLACEHOLDER>
    #     channel: <SLACK_CHANNEL_PLACEHOLDER>
  - name: <CRITICAL_RECEIVER_PLACEHOLDER>
    # 见上：真实通道由维护者在部署环境中配置，仓库只保留占位与幂等说明。
  - name: <WARNING_RECEIVER_PLACEHOLDER>
  - name: <INFO_RECEIVER_PLACEHOLDER>
