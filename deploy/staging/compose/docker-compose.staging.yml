# Flower WMS Sprint E2 · 非生产 staging 栈（本机隔离 / 远程 staging 复用同一拓扑）
#
# 隔离约定（详见 deploy/staging/README.md）：
#   - 项目名由 -p 指定：基线 flower-e2-staging、验证 flower-e2-verify
#   - 容器名/网络/卷均由项目名派生；*不得* 与生产 *-prod、flower-v2-pg、原生 PG 冲突
#   - 宿主端口：基线 18081/15433，验证 18082/15434（仅绑定 127.0.0.1）
#   - V1/V2 独立库；V2 库名由 V2_DB_NAME 指定（init 脚本创建）
#   - nginx 边缘不包含（与生产已知差异，见 README）
#
# 依赖环境变量（由 scripts/Invoke-Staging.ps1 设置）：
#   STAGING_PROJECT / STAGING_IMAGE / STAGING_WEB_PORT / STAGING_DB_PORT / STAGING_ENV_NAME
#
# 注意：本文件只用于 staging；生产使用仓库根的 docker-compose.yml。

services:
  db:
    # 固定 digest（PG18 解析版本见 README 记录），避免浮动 tag 在 staging 漂移
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: ${STAGING_PROJECT:-flower-e2-staging}-db
    restart: "no"
    env_file:
      - ../.runtime/${STAGING_ENV_NAME:-staging}.env
    volumes:
      # PG18 官方镜像 PGDATA=/var/lib/postgresql/18/docker，卷挂载上级目录
      - postgres_data:/var/lib/postgresql
      # 空数据卷首次启动时按 V2_DB_NAME 创建独立 V2 库
      - ../db/init:/docker-entrypoint-initdb.d:ro
      # 备份/恢复产物写宿主 .runtime/backup（E2.3）
      - ../.runtime/backup:/backup
    ports:
      - "127.0.0.1:${STAGING_DB_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  flower-web:
    image: ${STAGING_IMAGE:?Set STAGING_IMAGE to the locally built flower-e2-staging image}
    pull_policy: never
    container_name: ${STAGING_PROJECT:-flower-e2-staging}-web
    restart: "no"
    env_file:
      - ../.runtime/${STAGING_ENV_NAME:-staging}.env
    environment:
      NODE_ENV: production
    volumes:
      - next_cache:/app/.next/cache
    ports:
      - "127.0.0.1:${STAGING_WEB_PORT:-18081}:3000"
    depends_on:
      db:
        condition: service_healthy

  flower-cron-worker:
    image: ${STAGING_IMAGE:?Set STAGING_IMAGE to the locally built flower-e2-staging image}
    pull_policy: never
    container_name: ${STAGING_PROJECT:-flower-e2-staging}-cron
    restart: "no"
    env_file:
      - ../.runtime/${STAGING_ENV_NAME:-staging}.env
    environment:
      NODE_ENV: production
    # 与生产一致：覆盖 entrypoint，cron 不执行迁移；迁移只由 flower-web entrypoint 负责
    entrypoint: ["npx", "tsx", "--tsconfig", "tsconfig.json", "scripts/cron-inventory-daemon.ts"]
    # 镜像内 HEALTHCHECK 探测 /api/health，cron 容器没有 web 服务会长期 unhealthy；
    # staging 显式禁用该健康检查，cron 是否有效运行以成功轮次日志为准（E2.1/E2.2 证据）。
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  next_cache:

