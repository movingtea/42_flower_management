# E1.8 发布 Runbook 非生产演练栈（独立于生产 docker-compose.yml）
#
# 隔离要求（与生产/本地开发环境同时运行）：
#   - Compose 项目名：flower-e1-8-rehearsal（容器、网络、卷均带此前缀）
#   - 容器名：flower-e18-*，不与 flower-web-prod / flower-postgres-prod 冲突
#   - 宿主端口：仅绑定 127.0.0.1，web 18080、db 15432（避开 3000/5432）
#   - 数据库：V1=flower_e18_v1、V2=flower_e18_v2（由 db/init 初始化脚本创建）
#   - 镜像：默认使用本地预构建镜像 flower-e05-verification:final；
#           真实发布演练由 scripts 生成 image override 指向模拟 SHA 标签。
#
# 用法见 deploy/rehearsal/README.md。请勿在 /root/flower-platform 等生产目录使用。

name: flower-e1-8-rehearsal

services:
  db:
    image: postgres:18-alpine
    container_name: flower-e18-db
    restart: "no"
    env_file:
      - ../.runtime/rehearsal.env
    volumes:
      # PostgreSQL 18 官方镜像的 PGDATA 为 /var/lib/postgresql/18/docker，
      # 因此卷挂载在上级目录 /var/lib/postgresql（与生产 compose 的旧写法不同，
      # 见 Runbook「已知风险」：生产 compose 目前挂载 /var/lib/postgresql/data）。
      - postgres_data:/var/lib/postgresql
      # 初始化时创建独立的 V2 数据库（仅在空数据卷首次启动时执行）
      - ../db/init:/docker-entrypoint-initdb.d:ro
      # 备份/恢复演练产物目录（宿主机 deploy/rehearsal/.runtime/backup）
      - ../.runtime/backup:/backup
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  flower-web:
    image: flower-e05-verification:final
    pull_policy: never
    container_name: flower-e18-web
    restart: "no"
    env_file:
      - ../.runtime/rehearsal.env
    environment:
      NODE_ENV: production
    volumes:
      - next-cache:/app/.next/cache
    ports:
      - "127.0.0.1:18080:3000"
    depends_on:
      db:
        condition: service_healthy

  flower-cron-worker:
    image: flower-e05-verification:final
    pull_policy: never
    container_name: flower-e18-cron
    restart: "no"
    env_file:
      - ../.runtime/rehearsal.env
    environment:
      NODE_ENV: production
    # 与生产 docker-compose.yml 相同：覆盖 entrypoint，绕开 docker-entrypoint.sh，
    # 因而 cron 容器不执行迁移；迁移只由 flower-web 启动时执行。
    entrypoint: ["npx", "tsx", "--tsconfig", "tsconfig.json", "scripts/cron-inventory-daemon.ts"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: flower-e1-8-rehearsal_postgres_data
  next-cache:
    name: flower-e1-8-rehearsal_next_cache
